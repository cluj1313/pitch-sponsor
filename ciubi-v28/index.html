<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ciubi Trading Companion</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#070b14">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{--bg:#070b14;--bg-2:#0b111f;--card:#0f1729;--card-2:#111a2e;--border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.16);--text:#e7ecf6;--text-dim:#8291ac;--text-faint:#8b9bb4;--orange:#f5a623;--orange-2:#f7931e;--green:#3ee6a6;--red:#fb7185;--radius:18px;}
  body.light{--bg:#f2f4f8;--bg-2:#ffffff;--card:#ffffff;--card-2:#e9edf3;--border:rgba(20,30,55,.10);--border-strong:rgba(20,30,55,.20);--text:#18213a;--text-dim:#4d5a75;--text-faint:#7c8699;--orange:#d97b00;--orange-2:#c96f00;--green:#0c8f60;--red:#cf3d5e;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:16px;font-size:14px;}
  .app{max-width:760px;margin:0 auto;padding:10px 10px 4px;}
  header.top{margin-bottom:6px;}
  h1.logo{font-size:1.05rem;font-weight:800;letter-spacing:.2px;margin:0;display:inline;}
  h1.logo span{color:var(--orange);}
  nav.tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;}
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{flex:0 0 auto;background:var(--card);border:1px solid var(--border);color:var(--text-dim);padding:6px 12px;border-radius:999px;font-size:.78rem;cursor:pointer;transition:border-color .15s,color .15s;}
  nav.tabs button.active{border-color:var(--orange);color:var(--orange);}
  hr.divider{border:none;border-top:1px solid var(--border);margin:2px 0 8px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:9px 12px;margin-bottom:6px;}
  .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;gap:8px;}
  .card-head h2{font-size:.88rem;margin:0;font-weight:700;}
  .card-sub{color:var(--text-dim);font-size:.72rem;margin:2px 0 8px;line-height:1.35;}
  .pill{font-size:.62rem;letter-spacing:.5px;color:var(--text-dim);border:1px solid var(--border-strong);padding:3px 9px;border-radius:999px;white-space:nowrap;}
  .pill.on{color:var(--orange);border-color:var(--orange);}
  .pill.good{color:var(--green);border-color:var(--green);}
  .pill.bad{color:var(--red);border-color:var(--red);}
  .field{margin-bottom:5px;display:flex;align-items:center;gap:8px;}
  .field label{display:block;flex:0 0 84px;font-size:.58rem;letter-spacing:.5px;color:var(--text-faint);margin:0;text-transform:uppercase;}
  .field input,.field select,.field textarea{flex:1;min-width:0;width:100%;background:var(--bg-2);border:1px solid var(--border);color:var(--text);padding:6px 9px;border-radius:8px;font-size:.78rem;outline:none;font-family:inherit;}
  .field input::placeholder,.field textarea::placeholder{color:var(--text-faint);}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--orange);}
  .field.stacked{display:block;}
  .field.stacked label{flex:none;display:block;margin-bottom:3px;}
  .field textarea{resize:vertical;min-height:40px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .btn{display:inline-block;background:linear-gradient(180deg,var(--orange),var(--orange-2));color:#1a1200;border:none;padding:10px 16px;border-radius:10px;font-size:.85rem;font-weight:700;cursor:pointer;width:100%;text-align:center;}
  .btn:active{transform:translateY(1px);}
  .btn.secondary{background:transparent;color:var(--text-dim);border:1px solid var(--border-strong);font-weight:600;width:auto;}
  .btn.danger{background:transparent;color:var(--red);border:1px solid var(--red);font-weight:600;width:auto;padding:6px 12px;font-size:.72rem;}
  .btn.small{width:auto;padding:6px 12px;font-size:.72rem;}
  .step{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;overflow:hidden;}
  .step.open{border-color:var(--orange);}
  .step-head{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;cursor:pointer;}
  .step-head .num{color:var(--orange);font-weight:800;margin-right:8px;letter-spacing:.5px;font-size:.78rem;}
  .step-head .title{font-weight:700;font-size:.85rem;}
  .step-head .left{display:flex;align-items:center;}
  .step-body{padding:0 14px 14px;}
  .status{font-size:.62rem;letter-spacing:1px;color:var(--text-faint);}
  .status.open{color:var(--orange);}
  .status.done{color:var(--green);}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px 12px;margin-bottom:5px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .stat label{font-size:.6rem;letter-spacing:.8px;color:var(--text-faint);margin:0;text-transform:uppercase;}
  .stat .val{font-size:.95rem;font-weight:800;line-height:1.1;}
  .val.green{color:var(--green);}
  .val.red{color:var(--red);}
  .val.orange{color:var(--orange);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .grid4{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  @media(min-width:520px){.grid4{grid-template-columns:repeat(4,1fr);}}
  .breakdown-row{display:flex;align-items:center;justify-content:space-between;background:var(--bg-2);border:1px solid var(--border);border-radius:8px;padding:5px 10px;margin-bottom:4px;font-size:.75rem;gap:6px;}
  .breakdown-row .name{font-weight:700;letter-spacing:.2px;white-space:nowrap;}
  .breakdown-row .mid{color:var(--text-dim);font-size:.68rem;text-align:center;}
  .breakdown-row .r{font-weight:700;white-space:nowrap;}
  table.journal{width:100%;border-collapse:collapse;font-size:.72rem;}
  table.journal th{text-align:left;color:var(--text-faint);font-weight:600;letter-spacing:.5px;text-transform:uppercase;font-size:.58rem;padding:0 8px 6px 0;border-bottom:1px solid var(--border);white-space:nowrap;}
  table.journal td{padding:6px 8px 6px 0;border-bottom:1px solid var(--border);white-space:nowrap;}
  .table-wrap{overflow-x:auto;}
  .empty{color:var(--text-faint);text-align:center;padding:14px 8px;font-size:.78rem;}
  .checklist-item{display:flex;align-items:center;gap:9px;padding:5px 0;border-bottom:1px solid var(--border);cursor:pointer;}
  .checklist-item:last-child{border-bottom:none;}
  .checkbox{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--border-strong);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:.68rem;color:transparent;}
  .checkbox.checked{background:var(--orange);border-color:var(--orange);color:#1a1200;font-weight:800;}
  .checklist-item span.txt{font-size:.78rem;color:var(--text);}
  .checklist-item.checked span.txt{color:var(--text-dim);text-decoration:line-through;}
  .footer-note{text-align:center;color:var(--text-faint);font-size:.64rem;margin:10px 0 2px;}
  .small-note{color:var(--text-faint);font-size:.68rem;line-height:1.4;}
  select{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238291ac' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 10px center;background-size:14px;}
  .link-btn{background:none;border:none;color:var(--orange);font-size:.72rem;cursor:pointer;padding:0;font-weight:600;}
  .mini-stat-label{display:block;font-size:.58rem;letter-spacing:.8px;color:var(--text-faint);margin-bottom:3px;text-transform:uppercase;}
  .mini-stat-val{font-size:.95rem;font-weight:800;}
  .tag{display:inline-flex;align-items:center;gap:7px;background:var(--bg-2);border:1px solid var(--border);border-radius:999px;padding:4px 11px;font-size:.72rem;font-weight:700;margin:0 4px 4px 0;}
  .shield-ok{border:1px solid var(--green);color:var(--green);border-radius:10px;padding:8px 10px;font-size:.75rem;font-weight:700;margin-bottom:6px;background:rgba(62,230,166,.06);}
  .shield-warn{border:1px solid var(--orange);color:var(--orange);border-radius:10px;padding:8px 10px;font-size:.75rem;font-weight:700;margin-bottom:6px;background:rgba(245,166,35,.08);}
  .shield-stop{border:2px solid var(--red);color:var(--red);border-radius:12px;padding:14px 10px;font-size:1rem;font-weight:800;text-align:center;margin-bottom:8px;letter-spacing:.5px;background:rgba(251,113,133,.12);}
  .sess{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;}
  .sess-item{flex:1;min-width:100px;background:var(--bg-2);border:1px solid var(--border);border-radius:10px;padding:6px 10px;font-size:.7rem;line-height:1.4;}
  .sess-item.open{border-color:var(--green);color:var(--green);}
  .sess-item.closed{color:var(--text-faint);}
  .news-row{display:flex;justify-content:space-between;gap:8px;font-size:.72rem;padding:4px 0;border-bottom:1px solid var(--border);}
  .news-row:last-child{border-bottom:none;}
  .ta-check{display:flex;align-items:center;gap:8px;font-size:.75rem;padding:3px 0;color:var(--text);}
  .ta-check input{width:16px;height:16px;accent-color:var(--orange);}
  #undo-btn{position:fixed;right:12px;bottom:12px;z-index:50;background:var(--card-2);color:var(--text);border:1px solid var(--orange);border-radius:999px;padding:9px 16px;font-size:.78rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.5);}
  #theme-btn{position:fixed;right:12px;bottom:56px;z-index:50;background:var(--card-2);color:var(--text);border:1px solid var(--border-strong);border-radius:999px;padding:9px 13px;font-size:.85rem;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.5);}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
const DEFAULT_STATE = {
  tab: 'dashboard',
  theme: 'dark',
  plan: { pair:'', direction:'', htfBias:'', session:'', setup:'', setupNotes:'', riskPercent:'', plannedRR:'', checklist:Array(10).fill(false), decision:'' },
  planActive: false,
  activeExecution: { entry:'', sl:'', tp:'', exit:'', executionQuality:'Clean', entryStatus:'Waiting' },
  trades: [],
  alerts: [],
  nextFocus: '',
  shield: { enabled:false, account:'10000', dailyPct:'4', maxDDPct:'8', riskPerTrade:'100' },
  instruments: ['EURUSD','GBPUSD','USDJPY','USDCHF','AUDUSD','NZDUSD','USDCAD','XAUUSD'],
  alertGroups: {
    forex: ['AUDCAD','AUDJPY','AUDNZD','AUDUSD','CADJPY','CHFJPY','EURAUD','EURCAD','EURCHF','EURGBP','EURJPY','EURNZD','EURUSD','GBPAUD','GBPCAD','GBPCHF','GBPJPY','GBPNZD','GBPUSD','NZDJPY','NZDUSD','USDCAD','USDCHF','USDJPY'],
    stocks: ['DXY','ES','NQ','YM','XAGUSD','XAUUSD','BTCUSD','BNBUSD','ETHUSD','SOLUSD']
  },
  timeAlerts: { asia_open:true, asia_close:true, lon_open:true, lon_close:true, ny_open:true, ny_close:true, c1h:false, c4h:true, cdaily:true, cweekly:false },
  timeLog: [],
  dailyReviews: {},
  quickTrade: { pair:'EURUSD', direction:'BUY', htfBias:'BULLISH', date: new Date().toISOString().slice(0,10), setup:'A+', entry:'', sl:'', exit:'', resultR:'', note:'Clean trade', ruleCompliance:'100% — followed rules', session:'London', additionalNote:'', photo:'' }
};

let state = JSON.parse(JSON.stringify(DEFAULT_STATE));
const HAS_WS = (typeof window.storage !== 'undefined') && window.storage && (typeof window.storage.get === 'function');

/* ---------------- UNDO + autosave ---------------- */
let undoStack = [];
let snapshot = null;
let saveTimeout;

async function writeState(raw){
  try{
    if(HAS_WS){ await window.storage.set('ciubi_state', raw); }
    else { localStorage.setItem('ciubi_state', raw); }
  }catch(e){ console.error('save failed', e); }
}
function dataOnly(){
  const o = JSON.parse(JSON.stringify(state));
  delete o.tab;
  return JSON.stringify(o);
}
function saveState(withUndo){
  if(withUndo === undefined) withUndo = true;
  const cur = dataOnly();
  if(withUndo && snapshot && cur !== snapshot){
    undoStack.push(snapshot);
    if(undoStack.length > 30) undoStack.shift();
  }
  snapshot = cur;
  clearTimeout(saveTimeout);
  const full = JSON.stringify(state);
  saveTimeout = setTimeout(()=>{ writeState(full); }, 150);
  updateUndoBtn();
}
function guardState(){
  if(!state.plan) state.plan = JSON.parse(JSON.stringify(DEFAULT_STATE.plan));
  if(!state.plan.checklist) state.plan.checklist = Array(10).fill(false);
  if(!state.trades) state.trades = [];
  if(!state.alerts) state.alerts = [];
  if(!state.shield) state.shield = JSON.parse(JSON.stringify(DEFAULT_STATE.shield));
  if(!state.instruments || !state.instruments.length) state.instruments = JSON.parse(JSON.stringify(DEFAULT_STATE.instruments));
  if(!state.alertGroups || !state.alertGroups.forex || !state.alertGroups.stocks) state.alertGroups = JSON.parse(JSON.stringify(DEFAULT_STATE.alertGroups));
  if(!state.timeAlerts) state.timeAlerts = JSON.parse(JSON.stringify(DEFAULT_STATE.timeAlerts));
  if(!state.timeLog) state.timeLog = [];
  if(!state.dailyReviews) state.dailyReviews = {};
  if(!state.theme) state.theme = 'dark';
}
function doUndo(){
  if(!undoStack.length) return;
  const prev = undoStack.pop();
  const data = JSON.parse(prev);
  const keepTab = state.tab;
  state = Object.assign({}, JSON.parse(JSON.stringify(DEFAULT_STATE)), data);
  state.tab = keepTab;
  guardState();
  snapshot = prev;
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(()=>{ writeState(JSON.stringify(state)); }, 150);
  render();
}
function updateUndoBtn(){
  const b = document.getElementById('undo-btn');
  if(b) b.textContent = `↩ Undo (${undoStack.length})`;
}

/* ---------------- TEMA light/dark (V2.19) ---------------- */
function toggleTheme(){
  state.theme = state.theme==='light' ? 'dark' : 'light';
  saveState();
  applyTheme();
}
function applyTheme(){
  document.body.classList.toggle('light', state.theme==='light');
  const b = document.getElementById('theme-btn');
  if(b) b.textContent = state.theme==='light' ? '☀️' : '🌙';
  const mc = document.querySelector('meta[name="theme-color"]');
  if(mc) mc.content = state.theme==='light' ? '#f2f4f8' : '#070b14';
}

async function loadState(){
  try{
    let raw = null;
    if(HAS_WS){
      const res = await window.storage.get('ciubi_state');
      if(res && res.value) raw = res.value;
    } else {
      raw = localStorage.getItem('ciubi_state');
    }
    if(raw){
      const loaded = JSON.parse(raw);
      state = Object.assign({}, JSON.parse(JSON.stringify(DEFAULT_STATE)), loaded);
      guardState();
    }
  }catch(e){}
  snapshot = dataOnly();
  render();
}

/* ---------------- backup ---------------- */
function exportBackup(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ciubi-backup-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}
function importBackup(file){
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const loaded = JSON.parse(r.result);
      if(!loaded || typeof loaded !== 'object') throw new Error('bad file');
      state = Object.assign({}, JSON.parse(JSON.stringify(DEFAULT_STATE)), loaded);
      guardState();
      saveState();
      render();
      alert('✅ Backup restaurat cu succes!');
    }catch(e){ alert('⚠️ Fișier de backup invalid.'); }
  };
  r.readAsText(file);
}

/* ---------------- CSV export ---------------- */
function exportCSV(){
  const rows = [['Date','Pair','Direction','HTF','Setup','Entry','SL','Exit','R','Note','Compliance','Session','AddNote']];
  state.trades.forEach(t=>{
    const R = calcR(t);
    rows.push([t.date,t.pair,t.direction,t.htfBias,t.setup,t.entry,t.sl,t.exit,(R==null?'':R.toFixed(2)),t.note,t.ruleCompliance,t.session,t.additionalNote]);
  });
  const csv = '\uFEFF' + rows.map(r=>r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ciubi-jurnal-' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

/* ---------------- equity curve ---------------- */
function drawEquity(){
  const c = document.getElementById('eq-cv');
  if(!c) return;
  const closed = closedTrades();
  const x = c.getContext('2d');
  const isL = state.theme==='light';
  if(!closed.length){
    c.width = c.clientWidth*2; c.height = 200;
    x.clearRect(0,0,c.width,c.height);
    x.fillStyle = isL?'#7c8699':'#8b9bb4'; x.font = '22px system-ui';
    x.fillText('Adaugă trade-uri pentru curba de equity.', 20, 100);
    return;
  }
  let run = 0; const pts = [0];
  closed.forEach(t=>{ run += t.R; pts.push(run); });
  const W = c.width = c.clientWidth*2, H = c.height = 360;
  const mn = Math.min(...pts), mx = Math.max(...pts), pad = (mx-mn)*0.15 || 1;
  const X = i=>10 + i*(W-20)/(pts.length-1);
  const Y = v=>H-20 - ((v-(mn-pad))/((mx+pad)-(mn-pad)))*(H-40);
  x.clearRect(0,0,W,H);
  if(mn<0 && mx>0){
    x.strokeStyle = isL?'rgba(0,0,0,.18)':'rgba(255,255,255,.15)'; x.setLineDash([6,6]);
    x.beginPath(); x.moveTo(10,Y(0)); x.lineTo(W-10,Y(0)); x.stroke(); x.setLineDash([]);
  }
  x.beginPath();
  pts.forEach((v,i)=> i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v)));
  const up = pts[pts.length-1] >= 0;
  x.strokeStyle = up ? (isL?'#0c8f60':'#3ee6a6') : (isL?'#cf3d5e':'#fb7185'); x.lineWidth = 3; x.stroke();
  x.lineTo(W-10,H); x.lineTo(10,H); x.closePath();
  x.fillStyle = up ? 'rgba(62,230,166,.10)' : 'rgba(251,113,133,.10)'; x.fill();
  x.fillStyle = isL?'#7c8699':'#8b9bb4'; x.font = '20px system-ui';
  x.fillText('max ' + fmtR(mx), 12, 24);
  x.fillText('min ' + fmtR(mn), 12, H-6);
}

/* ---------------- calculator pozitie ---------------- */
function calcPos(){
  const g = id=>{ const el=document.getElementById(id); return el?parseFloat(el.value):NaN; };
  const bal = g('pc-bal'), risk = g('pc-risk'), sl = g('pc-sl'), pv = g('pc-pv');
  const out = document.getElementById('pc-out');
  if(!out) return;
  const risk$ = (bal>0 && risk>0) ? bal*risk/100 : 0;
  const lot = (risk$>0 && sl>0 && pv>0) ? risk$/(sl*pv) : 0;
  out.innerHTML = lot>0
    ? `<div class="mini-stat-val" style="color:var(--green)">${lot.toFixed(2)} lot</div><p class="small-note">Risc $${risk$.toFixed(0)} · SL ${sl} pips · pip value $${pv}/lot · Forex major & XAU: 10</p>`
    : `<p class="small-note">Completează sold, risc %, SL și valoare pip.</p>`;
}

/* ---------------- poza pe trade ---------------- */
let pendingPhoto = '';
function readPhoto(file, cb){
  const r = new FileReader();
  r.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      const max = 900;
      let w = img.width, h = img.height;
      const sc = Math.min(1, max/Math.max(w,h));
      w = Math.round(w*sc); h = Math.round(h*sc);
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      cb(cv.toDataURL('image/jpeg',0.72));
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
}
function showPhoto(id){
  const t = state.trades.find(x=>String(x.id)===String(id));
  if(!t || !t.photo) return;
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:99;display:flex;align-items:center;justify-content:center;padding:16px';
  d.onclick = ()=>d.remove();
  d.innerHTML = `<img src="${t.photo}" style="max-width:100%;max-height:92%;border-radius:12px"/>`;
  document.body.appendChild(d);
}

/* ---------------- review zilnic ---------------- */
const DAILY_QS = [
  'Am respectat planul și checklist-ul azi?',
  'Am tranzacționat doar în sesiunea potrivită?',
  'Am respectat riscul maxim pe trade?',
  'Am evitat revenge / FOMO?',
  'Am notat toate trade-urile în jurnal?'
];
function todayKey(){ return new Date().toISOString().slice(0,10); }
function dailyRec(){
  const k = todayKey();
  if(!state.dailyReviews[k]) state.dailyReviews[k] = {a:[false,false,false,false,false], note:''};
  return state.dailyReviews[k];
}
function setDaily(i, val){
  dailyRec().a[i] = val;
  saveState();
  renderDaily();
}
function setDailyNote(v){
  dailyRec().note = v;
  saveState();
}
function last7HTML(){
  const rows = [];
  for(let i=1;i<=7;i++){
    const d = new Date(Date.now()-i*86400000).toISOString().slice(0,10);
    const r = state.dailyReviews[d];
    if(r){

function wall(tz){
  try{
    const parts = new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',hour12:false,day:'2-digit',weekday:'short'}).formatToParts(new Date());
    const g = t=>parts.find(p=>p.type===t).value;
    return {min:(+g('hour')%24)*60 + (+g('minute')), day:+g('day'), wd:g('weekday')};
  }catch(e){ return {min:0, day:1, wd:'Mon'}; }
}
function crossedTz(prev, now, target){
  if(prev.day === now.day) return prev.min < target && now.min >= target;
  return (prev.min < target) || (now.min >= target);
}
let taPrev = null;
function checkTimeAlerts(){
  const cfg = state.timeAlerts || {};
  const now = { utcMin: Math.floor(Date.now()/60000) };
  ['Asia/Tokyo','Europe/London','America/New_York'].forEach(tz=> now[tz]=wall(tz));
  if(!taPrev){ taPrev = now; renderTimeCard(); return; }
  const fired = [];
  TIME_EVENTS.forEach(ev=>{
    if(!cfg[ev.id]) return;
    let hit = false;
    if(ev.every){
      hit = Math.floor(taPrev.utcMin/ev.every) !== Math.floor(now.utcMin/ev.every);
    } else if(ev.weekday !== undefined){
      const w = now[ev.tz];
      if(WD.indexOf(w.wd) === ev.weekday) hit = crossedTz(taPrev[ev.tz], w, ev.min);
    } else {
      hit = crossedTz(taPrev[ev.tz], now[ev.tz], ev.min);
    }
    if(hit) fired.push(ev.label);
  });
  taPrev = now;
  if(fired.length){
    fired.forEach(msg=>{
      timeNotify(msg);
      (state.timeLog = state.timeLog||[]).unshift({t:new Date().toISOString(), msg});
      state.timeLog = state.timeLog.slice(0,10);
    });
    saveState();
  }
  renderTimeCard();
}
function timeNotify(msg){
  beep();
  try{ if(navigator.vibrate) navigator.vibrate([150,80,150]); }catch(e){}
  try{ if('Notification' in window && Notification.permission==='granted') new Notification('⏰ Ciubi', {body: msg}); }catch(e){}
}

}
function upcomingHTML(){
  const cfg = state.timeAlerts || {};
  const base = taPrev ? taPrev.utcMin : Math.floor(Date.now()/60000);
  const rows = [];
  TIME_EVENTS.forEach(ev=>{
    if(!cfg[ev.id]) return;
    if(ev.every){
      const next = ev.every - (base % ev.every);
      rows.push({delta:next, label:ev.label});
    } else if(ev.weekday !== undefined){
      const w = wall(ev.tz);
      const wdI = WD.indexOf(w.wd);
      let days = (ev.weekday - wdI + 7) % 7;
      let delta = days*1440 + (ev.min - w.min);
      if(delta <= 0) delta += 7*1440;
      rows.push({delta, label:ev.label});
    } else {
      const w = wall(ev.tz);
      let delta = (ev.min - w.min + 1440) % 1440;
      if(delta === 0) delta = 1440;
      rows.push({delta, label:ev.label});
    }
  });
  rows.sort((a,b)=>a.delta-b.delta);
  if(!rows.length) return `<p class="small-note">Nicio alertă de timp activă — bifează mai sus ce vrei să auzi.</p>`;
  return rows.slice(0,5).map(r=>{
    const when = new Date(Date.now()+r.delta*60000);
    return `<div class="news-row"><span>${r.label}</span><b>în ${Math.floor(r.delta/60)}h ${r.delta%60}m (${when.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})})</b></div>`;
  }).join('');
}

let newsEvents;
function tzHour(tz){
  try{
    const parts = new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
    let h = +parts.find(p=>p.type==='hour').value;
    const m = +parts.find(p=>p.type==='minute').value;
    if(h===24) h=0;
    return h + m/60;
  }catch(e){ return null; }
}
function offHours(tz){
  const now = new Date();
  const utc = now.getUTCHours()+now.getUTCMinutes()/60;
  const l = tzHour(tz);
  if(l===null) return 0;
  let d = l-utc; if(d>12)d-=24; if(d<-12)d+=24; return d;
}
function fmtHM(h){
  h = ((h%24)+24)%24;
  const H = Math.floor(h), M = Math.round((h-H)*60);
  return String(H).padStart(2,'0')+':'+String(M).padStart(2,'0');
}
const SESS_DEFS = [
  {name:'Asia (Tokyo)', tz:'Asia/Tokyo', from:9, to:15},
  {name:'London', tz:'Europe/London', from:8, to:16.5},
  {name:'New York', tz:'America/New_York', from:8, to:17}
];
function sessInfo(){
  const offRO = offHours('Europe/Bucharest');
  const utcNow = new Date().getUTCHours()+new Date().getUTCMinutes()/60;
  return SESS_DEFS.map(d=>{
    const off = offHours(d.tz);
    const nowL = tzHour(d.tz);
    const cur = (nowL===null) ? (utcNow+off) : nowL;
    const open = cur>=d.from && cur<d.to;
    const mins = open ? Math.round((d.to-cur)*60) : Math.round(((d.from-cur+24)%24)*60);
    return { name:d.name, open, mins,
      openRO: fmtHM(d.from - off + offRO),
      closeRO: fmtHM(d.to - off + offRO) };
  });
}

/* ---------------- R calc ---------------- */
function calcR(t){
  if(t.resultR !== '' && t.resultR !== undefined && t.resultR !== null){
    const v = parseFloat(t.resultR);
    if(!isNaN(v)) return v;
  }
  const entry = parseFloat(t.entry), sl = parseFloat(t.sl), exit = parseFloat(t.exit);
  if(isNaN(entry) || isNaN(sl) || isNaN(exit)) return null;
  const risk = Math.abs(entry - sl);
  if(risk === 0) return null;
  const reward = t.direction === 'SELL' ? (entry - exit) : (exit - entry);
  return reward / risk;
}
function fmtR(v){
  if(v === null || v === undefined || isNaN(v)) return '+0.00R';
  const sign = v >= 0 ? '+' : '';
  return sign + v.toFixed(2) + 'R';
}
function rClass(v){
  if(v === null || v === undefined) return '';
  return v > 0 ? 'green' : (v < 0 ? 'red' : '');
}
function fmtMoney(v){
  if(v === null || v === undefined || isNaN(v)) return '$0';
  return (v < 0 ? '-$' : '$') + Math.abs(v).toFixed(0);
}
function closedTrades(){
  return state.trades.map(t=>({...t, R: calcR(t)})).filter(t=> t.R !== null);
}

/* ---------------- SHIELD ---------------- */
function shieldCalc(){
  const s = state.shield;
  const account = parseFloat(s.account)||0;
  const risk = parseFloat(s.riskPerTrade)||0;
  const dailyLimit = account*(parseFloat(s.dailyPct)||0)/100;
  const maxDD = account*(parseFloat(s.maxDDPct)||0)/100;
  const today = new Date().toISOString().slice(0,10);
  const closed = closedTrades();
  const todayR = closed.filter(t=>t.date===today).reduce((a,t)=>a+t.R,0);
  const today$ = todayR*risk;
  let run=0, peak=0, dd=0;
  closed.forEach(t=>{ run+=t.R*risk; peak=Math.max(peak,run); dd=Math.max(dd,peak-run); });
  return { dailyLimit, maxDD, today$, dd, left: dailyLimit + today$ };
}
function shieldStatus(){
  if(!state.shield || !state.shield.enabled) return null;
  const c = shieldCalc();
  const lost = -c.today$;
  if(c.dailyLimit>0 && lost >= c.dailyLimit) return {level:'stop', msg:'STOP! LIMITA ZILNICĂ ATINSĂ. Închide platforma.'};
  if(c.maxDD>0 && c.dd >= c.maxDD) return {level:'stop', msg:'STOP! DRAWDOWN MAXIM ATINS. Închide platforma.'};
  if(c.dailyLimit>0 && lost >= 0.8*c.dailyLimit) return {level:'warn', msg:`Atenție: ai folosit ${Math.round(lost/c.dailyLimit*100)}% din limita zilnică (${fmtMoney(lost)} din ${fmtMoney(c.dailyLimit)}).`};
  return {level:'ok', msg:`Shield activ. P&L azi: ${fmtMoney(c.today$)} · Mai ai ${fmtMoney(c.left)} din limita zilnică.`};
}
function shieldBannerHTML(){
  const st = shieldStatus();
  if(!st) return '';
  if(st.level==='stop') return `<div class="shield-stop">🛑 ${st.msg}</div>`;
  if(st.level==='warn') return `<div class="shield-warn">⚠️ ${st.msg}</div>`;
  return `<div class="shield-ok">🛡 ${st.msg}</div>`;
}

function planStep(n,title,body,rightLabel){
  const isOpen = planOpenStep === n;
  const done = stepDoneStatus(n);

  return `

        <div class="left"><span class="num">${String(n).padStart(2,'0')}</span><span class="title">${title}</span></div>
        <span class="status ${statusClass}">${statusText}</span>
      </div>
      ${isOpen ? `<div class="step-body">${body}</div>` : ''}
    </div>
  `;
}

/* ---------------- REVIEW ---------------- */
function viewReview(){
  const closed = closedTrades();
  const wins = closed.filter(t=>t.R>0).length;
  const losses = closed.filter(t=>t.R<0).length;
  const total = closed.length;
  const winRate = total ? (wins/total*100) : 0;
  const totalR = closed.reduce((s,t)=>s+t.R,0);

  function group(field, values){
    return values.map(v=>{
      const rows = closed.filter(t=>t[field]===v);
      const w = rows.filter(t=>t.R>0).length;
      const r = rows.reduce((s,t)=>s+t.R,0);
      return {name:v, trades:rows.length, wins:w, R:r};
    });
  }
  const dir = group('direction',['BUY','SELL']);
  const htf = group('htfBias',['BULLISH','BEARISH','NEUTRAL']);

  const pairHtf = {};
  closed.forEach(t=>{
    const key = `${t.pair} · ${t.htfBias}`;
    pairHtf[key] = pairHtf[key] || {trades:0,wins:0,R:0};
    pairHtf[key].trades++;
    if(t.R>0) pairHtf[key].wins++;
    pairHtf[key].R += t.R;
  });

  const avgWin = wins ? closed.filter(t=>t.R>0).reduce((s,t)=>s+t.R,0)/wins : 0;
  const avgLoss = losses ? closed.filter(t=>t.R<0).reduce((s,t)=>s+t.R,0)/losses : 0;
  const grossWin = closed.filter(t=>t.R>0).reduce((s,t)=>s+t.R,0);
  const grossLoss = Math.abs(closed.filter(t=>t.R<0).reduce((s,t)=>s+t.R,0));
  const profitFactor = grossLoss ? (grossWin/grossLoss).toFixed(2) : '-';
  const expectancy = total ? totalR/total : 0;

  let running = 0, peak = 0, maxDD = 0;
  let curStreakW = 0, curStreakL = 0, bestStreakW = 0, worstStreakL = 0;
  closed.forEach(t=>{
    running += t.R; peak = Math.max(peak, running);
    maxDD = Math.min(maxDD, running - peak);
    if(t.R>0){ curStreakW++; curStreakL=0; bestStreakW=Math.max(bestStreakW,curStreakW); }
    else if(t.R<0){ curStreakL++; curStreakW=0; worstStreakL=Math.max(worstStreakL,curStreakL); }
    else { curStreakW=0; curStreakL=0; }
  });
  const currentDD = running - peak;

  function complianceBucket(t){
    const c = t.ruleCompliance || '';
    if(c.startsWith('100')) return '90-100%';
    if(c.startsWith('70')) return '70-89%';
    if(c.startsWith('50')) return '50-69%';
    return '0-49%';
  }
  const buckets = ['90-100%','70-89%','50-69%','0-49%'].map(b=>{
    const rows = closed.filter(t=>complianceBucket(t)===b);
    const w = rows.filter(t=>t.R>0).length;
    const r = rows.reduce((s,t)=>s+t.R,0);
    return {name:b, trades:rows.length, wins:w, R:r};
  });

  const bySession = {};
  closed.forEach(t=>{
    bySession[t.session] = bySession[t.session] || {trades:0,wins:0,R:0};
    bySession[t.session].trades++;
    if(t.R>0) bySession[t.session].wins++;
    bySession[t.session].R += t.R;
  });

  return `
    <div class="stat"><label>Total R</label><div class="val ${rClass(totalR)}">${fmtR(totalR)}</div></div>
    <div class="stat"><label>Wins</label><div class="val green">${wins}</div></div>
    <div class="stat"><label>Losses</label><div class="val red">${losses}</div></div>
    <div class="stat"><label>Win rate</label><div class="val">${winRate.toFixed(1)}%</div></div>

    <div class="card">
      <div class="card-head"><h2>📈 Curba de equity (R cumulativ)</h2><button class="btn small secondary" onclick="exportCSV()"> CSV</button></div>
      <canvas id="eq-cv" style="width:100%;height:180px"></canvas>
    </div>

    <div class="card">
      <h2>Direction</h2>
      ${dir.map(d=>`<div class="breakdown-row"><span class="name">${d.name}</span><span class="mid">${d.wins}W / ${d.trades-d.wins}L &nbsp; ${d.trades?((d.wins/d.trades)*100).toFixed(1):'0.0'}%</span><span class="r ${rClass(d.R)}">${fmtR(d.R)}</span></div>`).join('')}
    </div>

    <div class="card">
      <h2>HTF Bias</h2>
      ${htf.map(d=>`<div class="breakdown-row"><span class="name">${d.name==='BULLISH'||d.name==='BEARISH'?('WITH/'+d.name):d.name}</span><span class="mid">${d.wins}W / ${d.trades-d.wins}L &nbsp; ${d.trades?((d.wins/d.trades)*100).toFixed(1):'0.0'}%</span><span class="r ${rClass(d.R)}">${fmtR(d.R)}</span></div>`).join('')}
    </div>

    <div class="card">
      <h2>Pair + HTF breakdown</h2>
      ${Object.keys(pairHtf).length===0 ? `<div class="empty">Fara trade-uri inca.</div>` : Object.entries(pairHtf).map(([name,d])=>`
        <div class="breakdown-row"><span class="name">${name}</span><span class="mid">${d.trades} trade</span><span class="r ${rClass(d.R)}">${fmtR(d.R)}</span></div>
      `).join('')}
    </div>

    <div class="card">
      <h2>Expectancy &amp; Risk</h2>
      <div class="grid4">
        <div><span class="mini-stat-label">Expectancy/trade</span><div class="mini-stat-val ${rClass(expectancy)}">${fmtR(expectancy)}</div></div>
        <div><span class="mini-stat-label">Avg win</span><div class="mini-stat-val green">${fmtR(avgWin)}</div></div>
        <div><span class="mini-stat-label">Avg loss</span><div class="mini-stat-val red">${fmtR(avgLoss)}</div></div>
        <div><span class="mini-stat-label">Profit factor</span><div class="mini-stat-val">${profitFactor}</div></div>
      </div>
      <p class="small-note" style="margin-top:8px;">Expectanta pozitiva inseamna ca trade-ul mediu istoric a fost profitabil in termeni de R.</p>
      <hr class="divider"/>
      <div class="grid4">
        <div><span class="mini-stat-label">Max drawdown</span><div class="mini-stat-val red">${fmtR(maxDD)}</div></div>
        <div><span class="mini-stat-label">Current DD</span><div class="mini-stat-val green">${fmtR(currentDD)}</div></div>
        <div><span class="mini-stat-label">Best win streak</span><div class="mini-stat-val green">${bestStreakW}</div></div>
        <div><span class="mini-stat-label">Worst loss streak</span><div class="mini-stat-val red">${worstStreakL}</div></div>
      </div>
    </div>

    <div class="card">
      <h2>Rule Compliance</h2>
      ${buckets.map(b=>`<div class="breakdown-row"><span class="name">${b.name}</span><span class="mid">${b.trades} trades &nbsp; ${b.trades?((b.wins/b.trades)*100).toFixed(1):'0.0'}% win</span><span class="r ${rClass(b.R)}">${fmtR(b.R)}</span></div>`).join('')}
      <p class="small-note" style="margin-top:10px;">Arata daca executia disciplinata este asociata cu rezultate mai bune.</p>
    </div>

    <div class="card">
      <h2>Session Performance</h2>
      ${Object.keys(bySession).length===0 ? `<div class="empty">Adauga trade-uri pentru a vedea performanta pe sesiune.</div>` : Object.entries(bySession).map(([name,d])=>`
        <div class="breakdown-row"><span class="name">${name}</span><span class="mid">${d.trades} trade · ${(d.wins/d.trades*100).toFixed(0)}% win</span><span class="r ${rClass(d.R)}">${fmtR(d.R)}</span></div>
      `).join('')}
    </div>
  `;
}

/* ---------------- IMPROVE ---------------- */
function viewImprove(){
  const closed = closedTrades();
  const noteCounts = {};
  closed.forEach(t=>{
    if(!t.note) return;
    noteCounts[t.note] = (noteCounts[t.note]||0)+1;
  });
  const patterns = Object.entries(noteCounts).sort((a,b)=>b[1]-a[1]).filter(p=>p[1]>=2);

  const bySetup = {};
  closed.forEach(t=>{
    bySetup[t.setup] = bySetup[t.setup] || {trades:0,wins:0,R:0};
    bySetup[t.setup].trades++;
    if(t.R>0) bySetup[t.setup].wins++;
    bySetup[t.setup].R += t.R;
  });

  return `
    <div class="card">
      <h2>Improve</h2>
      <p class="card-sub">Foloseste jurnalul pentru a identifica tipare de comportament repetate. Datele raman pe acest dispozitiv.</p>

    </div>

    <div class="card">
      <h2>Behavior patterns</h2>
      ${patterns.length===0 ? `<div class="empty">Adauga trade-uri pentru a descoperi tipare de comportament.</div>` : patterns.map(p=>`
        <div class="breakdown-row"><span class="name">${p[0]}</span><span class="mid">${p[1]} aparitii</span></div>
      `).join('')}
    </div>

    <div class="card">
      <h2>Setup performance</h2>
      ${Object.keys(bySetup).length===0 ? `<div class="empty">Fara date de setup inca.</div>` : Object.entries(bySetup).map(([name,d])=>`
        <div class="breakdown-row"><span class="name">${name}</span><span class="mid">${d.trades} trade · ${(d.wins/d.trades*100).toFixed(0)}% win</span><span class="r ${rClass(d.R)}">${fmtR(d.R)}</span></div>

    <div class="card">

      <button class="btn" id="save-focus-btn">Save focus</button>
    </div>
  `;
}

/* ---------------- BINDING ---------------- */
function bindTabContentEvents(){
  if(state.tab==='dashboard'){
    const eb = document.getElementById('export-btn');
    if(eb) eb.onclick = exportBackup;
    const ib = document.getElementById('import-btn');
    const fi = document.getElementById('import-file');
    if(ib && fi){
      ib.onclick = ()=>fi.click();
      fi.onchange = ()=>{ if(fi.files && fi.files[0]) importBackup(fi.files[0]); fi.value=''; };
    }
    const shOn = document.getElementById('sh-on');
    if(shOn) shOn.onchange = ()=>{ state.shield.enabled = shOn.checked; saveState(); renderTab(); };
    ['sh-account','sh-risk','sh-daily','sh-dd'].forEach(id=>{
      const el = document.getElementById(id);
      if(el) el.onchange = ()=>{
        state.shield.account = document.getElementById('sh-account').value;
        state.shield.riskPerTrade = document.getElementById('sh-risk').value;
        state.shield.dailyPct = document.getElementById('sh-daily').value;
        state.shield.maxDDPct = document.getElementById('sh-dd').value;
        saveState();
        renderTab();
      };
    });

    refreshAlertForm();

    const instBtn = document.getElementById('install-btn');
    const iosHint = document.getElementById('ios-hint');
    if(instBtn){
      if(/iphone|ipad|ipod/i.test(navigator.userAgent) && iosHint) iosHint.style.display = 'block';
      if(deferredPrompt) instBtn.style.display = 'inline-block';
      instBtn.onclick = async ()=>{
        if(deferredPrompt){
          deferredPrompt.prompt();
          const r = await deferredPrompt.userChoice;
          if(r.outcome==='accepted') instBtn.style.display = 'none';
          deferredPrompt = null;
        } else {
          alert('Android: meniul browser (⋮) → „Add to Home screen” / „Instalează aplicația”.\niPhone: Share (⬆) → „Add to Home Screen”.');
        }
      };
    }
  }

  document.querySelectorAll('[data-goto]').forEach(el=>{
    el.onclick = ()=>{ state.tab = el.dataset.goto; saveState(false); render(); };
  });

  if(state.tab==='plan'){
    live('p-pair', v=>state.plan.pair=valOrEmpty(v));
    live('p-direction', v=>state.plan.direction=valOrEmpty(v));
    live('p-htf', v=>state.plan.htfBias=valOrEmpty(v));
    live('p-session', v=>state.plan.session=valOrEmpty(v));
    live('p-setup', v=>state.plan.setup=valOrEmpty(v));
    live('p-setupnotes', v=>state.plan.setupNotes=v);
    live('p-risk', v=>state.plan.riskPercent=v);
    live('p-rr', v=>state.plan.plannedRR=v);
    live('p-decision', v=>state.plan.decision=v);

    document.querySelectorAll('[data-stepheader]').forEach(el=>{
      el.onclick = ()=>{
        const n = parseInt(el.dataset.stepheader);
        planOpenStep = planOpenStep === n ? 0 : n;
        renderTab();
      };
    });
    document.querySelectorAll('[data-next]').forEach(el=>{
      el.onclick = ()=>{
        planOpenStep = parseInt(el.dataset.next);
        saveState(false);
        renderTab();
      };
    });
    document.querySelectorAll('[data-check]').forEach(el=>{
      el.onclick = ()=>{
        const i = parseInt(el.dataset.check);
        state.plan.checklist[i] = !state.plan.checklist[i];
        saveState();
        renderTab();
      };
    });
    const saveBtn = document.getElementById('save-plan-btn');
    if(saveBtn) saveBtn.onclick = ()=>{
      state.planActive = true;
      state.tab = 'execute';
      saveState();
      render();
    };
  }

  if(state.tab==='execute'){
    live('e-entry', v=>state.activeExecution.entry=v);
    live('e-sl', v=>state.activeExecution.sl=v);
    live('e-tp', v=>state.activeExecution.tp=v);
    live('e-exit', v=>state.activeExecution.exit=v);
    live('e-quality', v=>state.activeExecution.executionQuality=v);
    live('e-status', v=>state.activeExecution.entryStatus=v);

    renderTimeCard();

    const loadBtn = document.getElementById('load-plan-btn');
    if(loadBtn) loadBtn.onclick = ()=>{ state.planActive = true; saveState(); renderTab(); };
    const saveExec = document.getElementById('save-execution-btn');
    if(saveExec) saveExec.onclick = ()=>{
      const e = state.activeExecution;
      const p = state.plan;
      const trade = {
        id: Date.now(),
        date: new Date().toISOString().slice(0,10),
        pair: p.pair||'-', direction: p.direction||'-', htfBias: p.htfBias||'-',
        setup: p.setup||'-', entry: e.entry, sl: e.sl, exit: e.exit, resultR:'',
        note: e.entryStatus, ruleCompliance:'100% — followed rules', session: p.session||'-',
        additionalNote: `Execution quality: ${e.executionQuality}`, photo:''
      };
      state.trades.push(trade);
      state.tab='trades';
      saveState();
      render();
    };
  }

  if(state.tab==='trades'){
    calcPos();

    const ph = document.getElementById('q-photo');
    if(ph) ph.onchange = ()=>{
      if(ph.files && ph.files[0]) readPhoto(ph.files[0], d=>{ pendingPhoto = d; alert('📸 Poză atașată — va fi salvată cu trade-ul.'); });
    };

    live('q-pair', v=>state.quickTrade.pair=v);
    live('q-direction', v=>state.quickTrade.direction=v);
    live('q-htf', v=>state.quickTrade.htfBias=v);
    live('q-date', v=>state.quickTrade.date=v);
    live('q-setup', v=>state.quickTrade.setup=v);
    live('q-entry', v=>state.quickTrade.entry=v);
    live('q-sl', v=>state.quickTrade.sl=v);
    live('q-exit', v=>state.quickTrade.exit=v);
    live('q-resultr', v=>state.quickTrade.resultR=v);
    live('q-note', v=>state.quickTrade.note=v);
    live('q-compliance', v=>state.quickTrade.ruleCompliance=v);
    live('q-session', v=>state.quickTrade.session=v);
    live('q-addnote', v=>state.quickTrade.additionalNote=v);

    const useBtn = document.getElementById('use-plan-btn');
    if(useBtn) useBtn.onclick = ()=>{
      const p = state.plan;
      const q = state.quickTrade;
      if(p.pair) q.pair = p.pair;
      if(p.direction) q.direction = p.direction;
      if(p.htfBias) q.htfBias = p.htfBias;
      if(p.setup) q.setup = p.setup;
      if(p.session) q.session = p.session;
      saveState();
      renderTab();
    };
    const addBtn = document.getElementById('add-trade-btn');
    if(addBtn) addBtn.onclick = ()=>{
      state.trades.push(Object.assign({id:Date.now(), photo:pendingPhoto||''}, state.quickTrade));
      pendingPhoto = '';
      saveState();
      renderTab();
    };
    document.querySelectorAll('[data-del]').forEach(el=>{
      el.onclick = ()=>{
        const id = parseInt(el.dataset.del);
        state.trades = state.trades.filter(t=>t.id!==id);
        saveState();
        renderTab();
      };
    });
    const delAll = document.getElementById('delete-all-btn');
    if(delAll) delAll.onclick = ()=>{
      if(confirm('Stergi toate trade-urile din jurnal?')){
        state.trades = [];
        saveState();
        renderTab();
      }
    };
  }

  if(state.tab==='review'){
    drawEquity();
  }

  if(state.tab==='improve'){
    renderDaily();
    live('next-focus', v=>state.nextFocus=v);
    const saveFocus = document.getElementById('save-focus-btn');
    if(saveFocus) saveFocus.onclick = ()=>{
      state.nextFocus = document.getElementById('next-focus').value;
      saveState();
      renderTab();
    };
  }
}

function valOrEmpty(v){ return v==='-' ? '' : v; }

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
